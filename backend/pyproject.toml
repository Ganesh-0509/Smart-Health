[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# A pragmatic core rule set: pycodestyle errors/warnings, pyflakes, import
# ordering, bugbear, comprehensions and pyupgrade.
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # FastAPI uses Depends()/Body() as call-expression defaults
]

[tool.ruff.lint.per-file-ignores]
# Tests and the conftest import the app after mutating os.environ on purpose.
"tests/*" = ["E402"]
"tests/conftest.py" = ["E402"]
